name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Download Sherpa-ONNX AAR
        run: |
          mkdir -p app/libs
          if [ ! -f app/libs/sherpa-onnx-2.0.2.aar ]; then
            curl -sL -o app/libs/sherpa-onnx-2.0.2.aar https://github.com/k2-fsa/sherpa-onnx/releases/download/v2.0.2/sherpa-onnx-2.0.2.aar
          fi
          SIZE=$(stat -c%s app/libs/sherpa-onnx-2.0.2.aar)
          echo "sherpa-onnx AAR size: $SIZE"
          test "$SIZE" -gt 40000000

      - name: Build debug APK
        env:
          # Optional repository secret; when absent the APK builds with an
          # empty key and voice mode shows "not configured". Never echoed.
          DOUBAO_API_KEY_FROM_CONFIG: ${{ secrets.DOUBAO_API_KEY_FROM_CONFIG }}
          VOICEIME_CORRECT_TOKEN: ${{ secrets.VOICEIME_CORRECT_TOKEN }}
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: voiceime-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Decode release keystore
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        run: |
          printf '%s' "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > /tmp/voiceime-release.keystore
          test -s /tmp/voiceime-release.keystore

      - name: Build release APK
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        env:
          DOUBAO_API_KEY_FROM_CONFIG: ${{ secrets.DOUBAO_API_KEY_FROM_CONFIG }}
          VOICEIME_CORRECT_TOKEN: ${{ secrets.VOICEIME_CORRECT_TOKEN }}
          KEYSTORE_PATH: /tmp/voiceime-release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: voiceime
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Upload release APK
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: voiceime-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
